name: Trigger auto deployment for rtc-consumer-app

# When this action will be executed
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RTCCONSUMERAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RTCCONSUMERAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RTCCONSUMERAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.RTCCONSUMERAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.RTCCONSUMERAPP_REGISTRY_PASSWORD }}
          containerAppName: rtc-consumer-app
          resourceGroup: real-time-chat
          imageToBuild: ghcr.io/rtc-consumer-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


