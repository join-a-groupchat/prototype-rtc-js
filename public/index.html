<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>uWebSockets Chat</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #121212; color: #e0e0e0; }
    #chat { display: flex; flex-direction: column; height: 100vh; }
    #messages { flex: 1; overflow-y: auto; padding: 10px; }
    #input { display: flex; background: #2c2c2c; padding: 10px; }
    input { flex: 1; padding: 8px; border: none; border-radius: 4px; background: #1e1e1e; color: #e0e0e0; }
    button { padding: 8px 16px; background: #3f51b5; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #5c6bc0; }
    .system { color: gray; font-style: italic; }
    .chat { margin: 4px 0; }
    .username { font-weight: bold; color: #bb86fc; }
  </style>
</head>
<body>
  <div id="chat">
    <div id="messages"></div>
    <div id="input">
      <input id="msgBox" placeholder="Type a message..." autocomplete="off" />
      <button id="sendBtn">Send</button>
    </div>
  </div>
  <script src="client.js"></script>
</body>
</html>
